name: Model PR review (OpenAI-compatible API)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [claude-pr-review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: claude-review-${{ github.event.client_payload.repository || github.repository }}-${{ github.event.client_payload.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Only trusted in-repository PRs; the workflow and review script are
    # checked out from the default branch, never from the PR head.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: [self-hosted, Linux, X64, claude-review]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review PR with configured OpenAI-compatible model API
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL || 'https://api.deepseek.com' }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY || secrets.DEEPSEEK_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-flash' }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "credential.helper"
          GIT_CONFIG_VALUE_0: "!/home/ubuntu/.local/bin/gh auth git-credential"
        run: |
          set -eu
          state="$HOME/.local/state/model-review/${REPO//\//_}-pr-$PR_NUMBER.json"
          work="$HOME/.local/share/model-review/${REPO//\//_}/$PR_NUMBER"
          python3 plugin/scripts/claude_pr_review.py \
            --repo "$REPO" --pr-number "$PR_NUMBER" \
            --gh /home/ubuntu/.local/bin/gh \
            --state "$state" --work "$work" --timeout 360

  dispatched-review:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.repository == 'jboone1989/EventGraph'
    runs-on: [self-hosted, Linux, X64, claude-review]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review EventGraph PR with configured model API
        env:
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL || 'https://api.deepseek.com' }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY || secrets.DEEPSEEK_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-flash' }}
          REPO: ${{ github.event.client_payload.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_REREVIEW_COMMENT_ID: ${{ github.event.client_payload.manual_rereview_comment_id || '' }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "credential.helper"
          GIT_CONFIG_VALUE_0: "!/home/ubuntu/.local/bin/gh auth git-credential"
        run: |
          set -eu
          [[ "$REPO" == 'jboone1989/EventGraph' ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$MANUAL_REREVIEW_COMMENT_ID" ]]; then
            # Python verifies owner-authored approval for this exact PR and SHA.
            [[ "$MANUAL_REREVIEW_COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          state="$HOME/.local/state/model-review/jboone1989_EventGraph-pr-$PR_NUMBER.json"
          work="$HOME/.local/share/model-review/jboone1989_EventGraph/$PR_NUMBER"
          manual_args=()
          if [[ -n "$MANUAL_REREVIEW_COMMENT_ID" ]]; then
            manual_args=(--manual-rereview-comment-id "$MANUAL_REREVIEW_COMMENT_ID")
          fi
          python3 plugin/scripts/claude_pr_review.py \
            --repo "$REPO" --pr-number "$PR_NUMBER" \
            --gh /home/ubuntu/.local/bin/gh \
            --state "$state" --work "$work" --timeout 360 \
            --expected-sha "$EXPECTED_SHA" "${manual_args[@]}"

  low-risk-merge:
    # GitHub itself enforces check/docker/e2e/deepseek-review before the merge.
    # Only this bounded, docs-only slice is eligible for immediate SHA-guarded merge.
    needs: [dispatched-review]
    if: >-
      github.event_name == 'repository_dispatch' &&
      needs.dispatched-review.result == 'success' &&
      github.event.client_payload.repository == 'jboone1989/EventGraph'
    runs-on: [self-hosted, Linux, X64, claude-review]
    timeout-minutes: 3
    steps:
      - name: Merge only verified low-risk documentation PRs
        env:
          REPO: ${{ github.event.client_payload.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REVIEWED_SHA: ${{ github.event.client_payload.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" == 'jboone1989/EventGraph' ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh=/home/ubuntu/.local/bin/gh
          pr="$("$gh" api "repos/$REPO/pulls/$PR_NUMBER")"
          # Refuse forks, drafts, other targets, and stale review events.
          if ! jq -e --arg sha "$REVIEWED_SHA" --arg repo "$REPO" '
              .state == "open" and (.draft | not) and
              .base.ref == "develop" and .head.repo.full_name == $repo and
              .head.sha == $sha and .changed_files >= 1 and .changed_files <= 3
            ' <<< "$pr" >/dev/null; then
            echo "Skip: ineligible PR or stale reviewed SHA"
            exit 0
          fi
          # Explicit success is required; a skipped/failed review cannot merge.
          reviewed="$("$gh" api "repos/$REPO/commits/$REVIEWED_SHA/status" \
            --jq '[.statuses[] | select(.context == "deepseek-review")][0].state // "missing"')"
          if [[ "$reviewed" != success ]]; then
            echo "Skip: DeepSeek review is $reviewed"
            exit 0
          fi
          files="$("$gh" api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100")"
          # Pilot allowlist only: Markdown examples, not application, policy,
          # release, security, dependencies, migrations, scripts or CI files.
          if ! jq -e --argjson count "$(jq -r '.changed_files' <<< "$pr")" '
              length == $count and
              (map(.additions + .deletions) | add <= 80) and
              all(.[];
                (.status == "added" or .status == "modified") and
                (.filename | test("^docs/examples/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+[.]md$"))
              )
            ' <<< "$files" >/dev/null; then
            echo "Skip: not in conservative docs-only allowlist"
            exit 0
          fi
          # Final SHA check is enforced atomically by GitHub. No bypass,
          # no retained per-PR Auto-merge setting, and no self-written merge engine.
          echo "Eligible LOW risk: $REPO#$PR_NUMBER at $REVIEWED_SHA"
          "$gh" api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$REVIEWED_SHA" -f merge_method=squash \
            -f "commit_title=docs: merge verified examples (#$PR_NUMBER)"
