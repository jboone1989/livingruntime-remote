<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}body{font:14px/1.5 system-ui;margin:0;padding:14px;color:var(--color-text-primary,inherit)}
h3{margin:0 0 8px;font-size:16px}small,.muted{opacity:.7}button{border:1px solid #888;background:transparent;color:inherit;border-radius:7px;padding:6px 10px;cursor:pointer}
button:disabled{opacity:.5}.danger{color:#be4444}.entry{border:1px solid rgba(140,140,140,.4);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}code{font-size:12px;overflow-wrap:anywhere}
input{padding:7px;border-radius:6px;border:1px solid #888;background:transparent;color:inherit;max-width:220px}
#status{min-height:22px;margin:10px 0}
</style></head><body>
<h3>LivingRuntime 凭据管理</h3>
<p class="muted">只显示句柄、授权用途、设备和有效期，不提供查看或复制密钥原文的入口。</p>
<div class="row"><button id="refresh">刷新</button><button id="add">添加凭据</button></div>
<p id="status">正在读取凭据元数据…</p>
<h3>保存的凭据</h3><div id="handles"></div>
<h3>有效授权</h3><div id="leases"></div>
<script>
(()=>{
"use strict";
const el=id=>document.getElementById(id),make=(tag,text,css)=>{const e=document.createElement(tag);if(text!=null)e.textContent=String(text);if(css)e.className=css;return e;};
const pending=new Map();let counter=1;
function unpack(value){const v=value?.structuredContent||value?.structured_content||value||{};if(v.isError)throw new Error("调用失败");return v;}
async function tool(name,args){
 if(window.openai?.callTool)return unpack(await window.openai.callTool(name,args));
 const id=counter++;window.parent.postMessage({jsonrpc:"2.0",id,method:"tools/call",params:{name,arguments:args}},"*");
 return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));
}
function send(prompt){
 if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});
 window.parent.postMessage({jsonrpc:"2.0",method:"ui/message",params:{role:"user",content:[{type:"text",text:prompt}]}},"*");
}
const status=s=>el("status").textContent=s;
function decorate(container,title,meta){const div=make("div",null,"entry");div.append(make("strong",title),make("p",meta,"muted"));container.append(div);return div;}
function button(text,cb,style){const b=make("button",text,style||"");b.addEventListener("click",cb);return b;}
function renderHandles(items){
 const host=el("handles");host.replaceChildren();
 if(!items.length){host.append(make("p","暂无凭据。","muted"));return;}
 for(const item of items){
  const meta="服务: "+item.provider+" ｜权限: "+(item.capabilities||[]).join(", ")+" ｜项目: "+(item.projects||[]).join(", ")+" ｜设备: "+(item.devices||[]).join(", ");
  const div=decorate(host,item.handle,meta),actions=make("div",null,"row");
  actions.append(button("轮换密钥",()=>send("请为 LivingRuntime Remote 凭据 "+item.handle+" 打开安全输入框进行轮换。沿用原来的 provider、capability、project 和 device，绝对不要在聊天里索取明文。")));
  const revoke=button("删除凭据",()=>{
   actions.replaceChildren(make("span","输入句柄确认删除：","muted"));
   const verify=make("input"),ok=button("确认永久删除",async()=>{
    if(verify.value!==item.handle){status("句柄不匹配，取消删除。");return;}
    ok.disabled=true;
    try{const result=await tool("delete_credential",{handle:item.handle});status("已删除 "+result.deleted+" 并撤销关联授权。");await refresh();}
    catch(_){status("删除失败，未收到确认。");ok.disabled=false;}
   },"danger");
   actions.append(verify,ok,button("取消",refresh));
  },"danger");
  actions.append(revoke);div.append(actions);
 }
}
function renderLeases(items){
 const host=el("leases");host.replaceChildren();
 if(!items.length){host.append(make("p","暂无有效授权。","muted"));return;}
 for(const item of items){
  const expires=new Date((item.expires_at||0)*1000).toLocaleString();
  const div=decorate(host,item.handle+" / "+item.capability,"目标: "+(item.device||"—")+" ｜项目: "+(item.project||"—")+" ｜到期: "+expires);
  div.append(button("撤销此授权",async()=>{
   try{await tool("revoke_credential_lease",{lease_id:item.lease_id});status("授权已撤销。");await refresh();}
   catch(_){status("撤销未确认。");}
  },"danger"));
 }
}
async function refresh(){
 el("refresh").disabled=true;
 try{
  const [handles,leases]=await Promise.all([
   tool("list_credentials",{}),tool("list_credential_leases",{active_only:true})
  ]);
  renderHandles(handles.credentials||[]);renderLeases(leases.leases||[]);
  status("读取完成。操作仅针对凭据句柄，不会展示密钥原文。");
 }catch(_){status("无法连接隔离凭据服务，请检查 Connector 和 Vault 状态。");}
 finally{el("refresh").disabled=false;}
}
el("refresh").addEventListener("click",refresh);
el("add").addEventListener("click",()=>send("请使用 LivingRuntime Remote 的 secure_input_open 为我打开一个新的安全凭据输入框，先确认 provider、capability 和目标设备，禁止让我直接在聊天中提供密钥。"));
window.addEventListener("message",event=>{
 if(event.source!==window.parent)return;
 const m=event.data;
 if(m?.jsonrpc==="2.0"&&pending.has(m.id)){
  const p=pending.get(m.id);pending.delete(m.id);
  if(m.error)p.reject(new Error("调用失败"));else p.resolve(unpack(m.result));
 }
});
void refresh();
})();
</script></body></html>
